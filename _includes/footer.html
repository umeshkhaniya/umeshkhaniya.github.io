<ul class="site-footer-links">
  <li class="p-name">
    {% if site.author.name %}
      {{ site.author.name | escape }}
    {% else %}
      {{ site.title | escape }}
    {% endif %}
  </li>
  <li>
    <a href="mailto:{{ site.author.email }}">Email</a>
  </li>
  <li>
    <a href="{{ site.author.linkedin }}">LinkedIn</a>
  </li>
  <li>
    <a href="{{ site.author.scholar }}">Google Scholar</a>
  </li>
</ul>
